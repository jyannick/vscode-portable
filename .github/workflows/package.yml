name: Package
run-name: Packaging of ${{ github.ref_name }} 📦
on:
  push: {}
  # Lets tag.yml explicitly dispatch this workflow against the tag it just
  # pushed. A plain push wouldn't do it: pushes made with the default
  # GITHUB_TOKEN (which tag.yml pushes the tag with) don't trigger other
  # workflows' `on: push` - an explicit dispatch is exempt from that
  # restriction. Dispatching with `ref: <tag>` makes github.ref inside this
  # run equal refs/tags/<tag>, so the release-publish step below still
  # fires exactly as it would from a real tag push.
  workflow_dispatch: {}
jobs:
  Prepare-Package:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create GitHub Releases
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Report which ref is being packaged
        run: echo "### Packaging \`${{ github.ref_name }}\` :package:" >> "$GITHUB_STEP_SUMMARY"

      # Downloads the latest stable VS Code tarball, unpacks it into
      # Portable-VSCode-linux-x64/, installs all extensions listed in
      # extensions.txt, and generates manifest.md.
      # Packaging into a zip is intentionally deferred until after the
      # VS Code warm-up step below.
      - name: Build portable package without archive
        run: |
          cd ${{ github.workspace }}
          make -f package.mk all_but_package

      # xvfb provides a virtual framebuffer so VS Code can start in the
      # headless GitHub Actions runner environment (no real display server).
      - name: Install system dependencies for VS Code
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Some extensions defer downloading platform-specific runtime binaries
      # until VS Code first activates them (e.g. CodeLLDB's native liblldb,
      # via install.ensurePlatformPackage in github.com/vadimcn/codelldb,
      # which writes a "platform.ok" marker into the extension's own folder
      # once its download finishes). We start VS Code once and poll for that
      # marker instead of sleeping a fixed amount: finishes as soon as the
      # download completes (usually well under 60s), and - unlike a fixed
      # sleep - still catches it if a download ever takes longer, up to the
      # 120s cap below, rather than silently shipping an incomplete runtime.
      #
      # This build is in "portable mode" (a data/ folder sits next to the
      # code binary - see https://code.visualstudio.com/docs/editor/portable),
      # which makes VS Code silently ignore --user-data-dir and always use
      # Portable-VSCode-linux-x64/data/user-data instead. So rather than
      # pointing at a throw-away directory (which would just be unused), we
      # seed the settings VS Code actually reads from that real path:
      # disabling Workspace Trust, since otherwise VS Code blocks on the
      # trust prompt before the extension host (and thus any extension
      # activation) ever starts, with no user here to click through it.
      - name: Start VS Code to download runtime assets
        run: |
          cd ${{ github.workspace }}
          mkdir -p Portable-VSCode-linux-x64/data/user-data/User
          echo '{ "security.workspace.trust.enabled": false }' > Portable-VSCode-linux-x64/data/user-data/User/settings.json
          xvfb-run -a --server-args='-screen 0 1280x720x24' bash -c '
            # Run VS Code in the background so the script can continue to the
            # sleep and the kill. Without &, the script would hang here forever
            # and the CI runner would eventually kill it with SIGTERM (exit 143).
            Portable-VSCode-linux-x64/bin/code \
              --disable-gpu \
              --no-sandbox \
              --disable-crash-reporter \
              --disable-updates \
              . \
              > code-activation.log 2>&1 &
            CODE_PID=$!
            # Poll for any extension'"'"'s runtime-download marker ("*.ok",
            # one directory under data/extensions - see the find command
            # below) instead of a fixed sleep.
            for i in $(seq 1 40); do
              if compgen -G "Portable-VSCode-linux-x64/data/extensions/*/*.ok" > /dev/null; then
                echo "Runtime download marker found after ~$((i * 3))s"
                break
              fi
              sleep 3
            done
            # The launcher above forks and detaches into its own Electron
            # process tree, so $CODE_PID has usually already exited by now;
            # kill everything tagged with our (portable-mode) user-data-dir
            # instead so downloads in flight are actually stopped before we zip.
            kill "$CODE_PID" 2>/dev/null || true
            wait "$CODE_PID" 2>/dev/null || true
            pkill -f "user-data-dir=$PWD/Portable-VSCode-linux-x64/data/user-data" 2>/dev/null || true
          '
          # Log what was downloaded so warm-up results are visible in CI.
          echo "--- Runtime assets present after warm-up ---"
          find Portable-VSCode-linux-x64/data/extensions \
            \( -name "*.ok" -o -name "*.bin" -o -name "*.so" \) | sort || true
          cat code-activation.log || true

      # Portable mode forced the warm-up run above to write its profile into
      # Portable-VSCode-linux-x64/data/user-data (logs, caches, workspace
      # storage for this CI checkout, the settings.json seeded above, ...).
      # None of that is meant to ship: install.mk's install-release does
      # "rmdir data/user-data/User" and replaces it with a symlink to the
      # end user's own config directory, and rmdir only succeeds on an EMPTY
      # directory - so a non-empty User here silently breaks that symlink
      # step on every install. Reset user-data back to the pristine (absent)
      # state "make unpack" leaves it in; only data/extensions (with its now-
      # downloaded runtime assets) is meant to survive the warm-up.
      - name: Reset build-time VS Code profile state
        run: |
          cd ${{ github.workspace }}
          rm -rf Portable-VSCode-linux-x64/data/user-data
          mkdir -p Portable-VSCode-linux-x64/data/user-data

      # Seal the final archive. --filesync ensures the zip exactly mirrors the
      # directory (removes stale entries, adds newly downloaded assets).
      - name: Recreate portable archive
        run: |
          cd ${{ github.workspace }}
          # Remove Unix socket and FIFO files left behind by VS Code.
          # zip cannot archive these special file types and exits with
          # code 18 ("not all files were readable") if any are present.
          find Portable-VSCode-linux-x64 \( -type s -o -type p \) -delete
          rm -f Portable-VSCode-linux-x64.zip
          zip --filesync -r Portable-VSCode-linux-x64.zip Portable-VSCode-linux-x64

      # Publish a GitHub Release with the zip as an artifact.
      # Only runs when the triggering ref is a version tag (e.g. v1.2.3).
      - name: Create new release for ${{ github.ref }} 🚀
        uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          artifacts: ${{ github.workspace }}/Portable-VSCode-linux-x64.zip
          bodyFile: "manifest.md"

      - run: echo "💡 This job's status is ${{ job.status }}."

